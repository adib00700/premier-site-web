<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche produit — Solaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="announce-bar">LIVRAISON OFFERTE DÈS 60€ · OFFRE ÉTÉ -20% AVEC LE CODE SOLEIL20</div>

<header class="site-header">
    <div class="container">
        <a href="index.html" class="brand">Sol<span>aire</span></a>
        <nav class="main-nav">
            <a href="index.html">Accueil</a>
            <a href="collection.html" class="active">Collection</a>
            <a href="collection.html?filtre=nouveautes">Nouveautés</a>
            <a href="collection.html?filtre=couleurs">Robes colorées</a>
            <a href="collection.html?filtre=bestsellers">Best-sellers</a>
            <a href="about.html">À propos</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="header-actions">
            <button class="menu-toggle" aria-label="Menu">☰</button>
            <a href="panier.html" class="icon-btn" aria-label="Panier">🛍️<span class="cart-count">0</span></a>
        </div>
    </div>
</header>

<div class="container" id="productRoot">
    <!-- rempli par JS -->
</div>

<div class="added-toast" id="addedToast">Ajouté au panier ✓</div>

<footer class="site-footer">
    <div class="container">
        <div class="footer-bottom">© 2026 Solaire. Tous droits réservés.</div>
    </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const product = findProduct(params.get('id')) || PRODUCTS[0];
let selectedColor = product.colors[0].name;
let selectedSize = null;

function renderProduct() {
    document.title = product.name + ' — Solaire';
    document.getElementById('productRoot').innerHTML = `
        <div class="pd-breadcrumb"><a href="index.html">Accueil</a> / <a href="collection.html">Collection</a> / ${product.name}</div>
        <div class="product-detail">
            <div class="gallery">
                <div class="gallery-main" id="galleryMain">
                    <div class="swatch-photo ${product.gradient}" style="width:100%;height:100%;">
                        <span class="swatch-label">Photo à intégrer — clique pour zoomer</span>
                    </div>
                </div>
                <div class="thumb-row">
                    <div class="thumb active swatch-photo ${product.gradient}"></div>
                    <div class="thumb swatch-photo ${product.gradient}" style="filter:brightness(1.15);"></div>
                    <div class="thumb swatch-photo ${product.gradient}" style="filter:brightness(0.85);"></div>
                </div>
                <p style="font-size:12px;color:var(--ink-soft);margin-top:10px;">Dépose tes photos dans /images et remplace les div .swatch-photo par des balises &lt;img&gt; pour les afficher ici.</p>
            </div>

            <div class="pd-info">
                <h1 class="pd-title">${product.name}</h1>
                <div class="pd-rating">★★★★★ <span>(128 avis)</span></div>
                <div class="pd-price">${formatPrice(product.price)} ${product.oldPrice ? `<span class="old-price">${formatPrice(product.oldPrice)}</span>` : ''}</div>

                <p style="color:var(--ink-soft);margin-bottom:24px;">${product.description}</p>

                <div class="option-block">
                    <div class="option-label"><span>Couleur : ${selectedColor}</span></div>
                    <div class="swatch-row" id="colorRow">
                        ${product.colors.map(c => `<span class="color-swatch ${c.name === selectedColor ? 'active' : ''}" style="background:${c.hex}" data-color="${c.name}"></span>`).join('')}
                    </div>
                </div>

                <div class="option-block">
                    <div class="option-label"><span>Taille</span><span class="size-guide-link" id="sizeGuideBtn">Guide des tailles</span></div>
                    <div class="size-row" id="sizeRow">
                        ${product.sizes.map(s => `<span class="size-btn" data-size="${s}">${s}</span>`).join('')}
                    </div>
                </div>

                <div class="qty-row">
                    <button type="button" id="qtyMinus">−</button>
                    <input type="number" id="qty" value="1" min="1">
                    <button type="button" id="qtyPlus">+</button>
                </div>

                <button class="btn btn-primary btn-block" id="addToCartBtn">Ajouter au panier</button>

                <div class="pd-tabs">
                    <details class="pd-tab" open>
                        <summary>Description</summary>
                        <div class="tab-content">${product.description}</div>
                    </details>
                    <details class="pd-tab">
                        <summary>Composition & entretien</summary>
                        <div class="tab-content">${product.composition} Lavage à 30°, ne pas mettre au sèche-linge.</div>
                    </details>
                    <details class="pd-tab" id="sizeGuideTab">
                        <summary>Guide des tailles</summary>
                        <div class="tab-content">
                            XS (34-36) · S (36-38) · M (38-40) · L (40-42) · XL (42-44).<br>
                            Conseil : en cas de doute entre deux tailles, prends la taille au-dessus pour un tombé plus fluide.
                        </div>
                    </details>
                </div>
            </div>
        </div>
    `;

    document.getElementById('colorRow').addEventListener('click', e => {
        if (!e.target.dataset.color) return;
        selectedColor = e.target.dataset.color;
        renderProduct();
    });

    document.getElementById('sizeRow').addEventListener('click', e => {
        if (!e.target.dataset.size) return;
        selectedSize = e.target.dataset.size;
        document.querySelectorAll('.size-btn').forEach(b => b.classList.toggle('active', b.dataset.size === selectedSize));
    });

    document.getElementById('sizeGuideBtn').addEventListener('click', () => {
        document.getElementById('sizeGuideTab').setAttribute('open', '');
        document.getElementById('sizeGuideTab').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    document.getElementById('qtyMinus').addEventListener('click', () => document.getElementById('qty').stepDown());
    document.getElementById('qtyPlus').addEventListener('click', () => document.getElementById('qty').stepUp());

    document.getElementById('galleryMain').addEventListener('click', function () {
        this.classList.toggle('zoomed');
    });

    document.getElementById('addToCartBtn').addEventListener('click', () => {
        if (!selectedSize) {
            alert('Choisis une taille avant d\'ajouter au panier.');
            return;
        }
        const qty = parseInt(document.getElementById('qty').value, 10) || 1;
        addToCart(product.id, selectedColor, selectedSize, qty);
        const toast = document.getElementById('addedToast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    });
}

renderProduct();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panier — Solaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="announce-bar">LIVRAISON OFFERTE DÈS 60€ · OFFRE ÉTÉ -20% AVEC LE CODE SOLEIL20</div>

<header class="site-header">
    <div class="container">
        <a href="index.html" class="brand">Sol<span>aire</span></a>
        <nav class="main-nav">
            <a href="index.html">Accueil</a>
            <a href="collection.html">Collection</a>
            <a href="collection.html?filtre=nouveautes">Nouveautés</a>
            <a href="collection.html?filtre=couleurs">Robes colorées</a>
            <a href="collection.html?filtre=bestsellers">Best-sellers</a>
            <a href="about.html">À propos</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="header-actions">
            <button class="menu-toggle" aria-label="Menu">☰</button>
            <a href="panier.html" class="icon-btn active" aria-label="Panier">🛍️<span class="cart-count">0</span></a>
        </div>
    </div>
</header>

<div class="page-banner container">
    <h1>Mon panier</h1>
</div>

<div class="container">
    <div class="cart-layout">
        <div id="cartItems"></div>
        <div class="cart-summary" id="cartSummary">
            <div class="summary-row"><span>Sous-total</span><span id="cartTotal">0,00 €</span></div>
            <div class="summary-row"><span>Livraison</span><span>Offerte dès 60€</span></div>
            <div class="summary-row summary-total"><span>Total</span><span id="cartTotalBottom">0,00 €</span></div>
            <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="alert('Démo : le paiement réel sera branché ici (Shopify Buy Button ou Stripe).')">Passer commande</button>
        </div>
    </div>
</div>

<footer class="site-footer">
    <div class="container">
        <div class="footer-bottom">© 2026 Solaire. Tous droits réservés.</div>
    </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
    const observer = new MutationObserver(() => {
        const t = document.getElementById('cartTotal');
        const b = document.getElementById('cartTotalBottom');
        if (t && b) b.textContent = t.textContent;
    });
    observer.observe(document.getElementById('cartItems'), { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', () => {
        const t = document.getElementById('cartTotal');
        const b = document.getElementById('cartTotalBottom');
        if (t && b) b.textContent = t.textContent;
    });
</script>

</body>
</html>
